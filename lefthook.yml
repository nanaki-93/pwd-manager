# Fast parallel pre-commit gates (<2s on staged files)
pre-commit:
  parallel: true
  commands:
    whitespace:
      glob: "*.{go,ts,tsx,js,py,kt,java,md,yml,yaml,json,toml}"
      run: git diff --cached --check -- {staged_files}
    gitleaks:
      run: |
        if command -v gitleaks >/dev/null 2>&1; then
          gitleaks protect --staged --no-banner --redact
        else
          echo "warning: gitleaks not found on PATH; skipping staged secret scan" >&2
        fi
